# GitLab CI/CD Pipeline для автоматической сборки и публикации Docker образов
# Модульная архитектура с параметризацией через динамические переменные

# Подключаем модули
include:
  - local: '.gitlab/ci/variables.yml'
  - local: '.gitlab/ci/stages.yml'
  - local: '.gitlab/ci/rules.yml'
  - local: '.gitlab/ci/cache.yml'
  - local: '.gitlab/ci/docker-build.yml'
  - local: '.gitlab/ci/docker-scan.yml'

# ==================== VALIDATION STAGE ====================

validate:dockerfiles:
  stage: validate
  image: hadolint/hadolint:latest-alpine
  script:
    - hadolint Dockerfile.backend || true
    - hadolint Dockerfile.frontend || true
    - hadolint Dockerfile.proxy || true
  allow_failure: true
  tags:
    - docker

# ==================== BUILD STAGE ====================

build:backend:
  stage: build
  extends:
    - .docker_build_template
    - .cache:maven
    - .rules:backend_changes
  variables:
    IMAGE_NAME: ${BACKEND_IMAGE_NAME}
    DOCKERFILE_PATH: ${BACKEND_DOCKERFILE}
    BUILD_CONTEXT: "."
    BUILD_TARGET: ${BACKEND_BUILD_TARGET}
    BUILD_ARGS: "MAVEN_OPTS=${MAVEN_OPTS}"
  artifacts:
    reports:
      dotenv: build.env
    expire_in: 1 hour
  script:
    # Расширяем базовый скрипт
    - !reference [.docker_build_template, script]
    # Сохраняем информацию об образе
    - echo "BACKEND_IMAGE=${IMAGE_TAGGED}" >> build.env

build:frontend:
  stage: build
  extends:
    - .docker_build_template
    - .cache:npm
    - .rules:frontend_changes
  variables:
    IMAGE_NAME: ${FRONTEND_IMAGE_NAME}
    DOCKERFILE_PATH: ${FRONTEND_DOCKERFILE}
    BUILD_CONTEXT: "."
    BUILD_TARGET: ${FRONTEND_BUILD_TARGET}
    BUILD_ARGS: "NODE_ENV=${NODE_ENV}"
  artifacts:
    reports:
      dotenv: build.env
    expire_in: 1 hour
  script:
    - !reference [.docker_build_template, script]
    - echo "FRONTEND_IMAGE=${IMAGE_TAGGED}" >> build.env

build:proxy:
  stage: build
  extends:
    - .docker_build_template
    - .rules:proxy_changes
  variables:
    IMAGE_NAME: ${PROXY_IMAGE_NAME}
    DOCKERFILE_PATH: ${PROXY_DOCKERFILE}
    BUILD_CONTEXT: "."
  artifacts:
    reports:
      dotenv: build.env
    expire_in: 1 hour
  script:
    - !reference [.docker_build_template, script]
    - echo "PROXY_IMAGE=${IMAGE_TAGGED}" >> build.env

# ==================== TEST STAGE ====================

test:backend:
  stage: test
  image: maven:3.8.6-eclipse-temurin-11
  extends:
    - .cache:maven
    - .rules:backend_changes
  before_script:
    - cd spring-backend
  script:
    - mvn ${MAVEN_CLI_OPTS} test
  coverage: '/Code coverage: \d+\.\d+/'
  artifacts:
    reports:
      junit:
        - spring-backend/target/surefire-reports/TEST-*.xml
    paths:
      - spring-backend/target/surefire-reports/
    expire_in: 30 days
    when: always
  tags:
    - docker

test:frontend:
  stage: test
  image: node:18-alpine
  extends:
    - .cache:npm
    - .rules:frontend_changes
  before_script:
    - cd react-frontend
  script:
    - npm ci
    - npm run test -- --coverage --watchAll=false
  coverage: '/All files[^|]*\|[^|]*\s+([\d\.]+)/'
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: react-frontend/coverage/cobertura-coverage.xml
    paths:
      - react-frontend/coverage/
    expire_in: 30 days
    when: always
  tags:
    - docker

# ==================== SCAN STAGE ====================

scan:backend:
  stage: scan
  extends:
    - .docker_scan_template
    - .cache:trivy
    - .rules:backend_changes
  variables:
    IMAGE_NAME: ${BACKEND_IMAGE_NAME}
  needs:
    - job: build:backend
      artifacts: true

scan:frontend:
  stage: scan
  extends:
    - .docker_scan_template
    - .cache:trivy
    - .rules:frontend_changes
  variables:
    IMAGE_NAME: ${FRONTEND_IMAGE_NAME}
  needs:
    - job: build:frontend
      artifacts: true

scan:proxy:
  stage: scan
  extends:
    - .docker_scan_template
    - .cache:trivy
    - .rules:proxy_changes
  variables:
    IMAGE_NAME: ${PROXY_IMAGE_NAME}
  needs:
    - job: build:proxy
      artifacts: true

# ==================== DEPLOY DEV STAGE ====================

deploy:dev:
  stage: deploy-dev
  image: alpine:latest
  extends:
    - .rules:main_branch
  needs:
    - job: build:backend
      artifacts: true
      optional: true
    - job: build:frontend
      artifacts: true
      optional: true
    - job: build:proxy
      artifacts: true
      optional: true
  before_script:
    - apk add --no-cache curl
  script:
    - echo "Deploying to DEV environment..."
    - echo "Backend image: ${BACKEND_IMAGE:-not built}"
    - echo "Frontend image: ${FRONTEND_IMAGE:-not built}"
    - echo "Proxy image: ${PROXY_IMAGE:-not built}"
    # Здесь добавьте команды для деплоя (kubectl, docker-compose, etc.)
    # Пример для docker-compose на удаленном сервере:
    # - scp docker-compose.yml user@dev-server:/app/
    # - ssh user@dev-server "cd /app && docker-compose pull && docker-compose up -d"
  environment:
    name: development
    url: https://dev.example.com
  tags:
    - docker

# ==================== DEPLOY STAGING STAGE ====================

deploy:staging:
  stage: deploy-staging
  image: alpine:latest
  extends:
    - .rules:main_branch
  needs:
    - job: scan:backend
      optional: true
    - job: scan:frontend
      optional: true
    - job: scan:proxy
      optional: true
  before_script:
    - apk add --no-cache curl
  script:
    - echo "Deploying to STAGING environment..."
    # Добавьте команды для деплоя в staging
  environment:
    name: staging
    url: https://staging.example.com
  when: manual
  tags:
    - docker

# ==================== DEPLOY PRODUCTION STAGE ====================

deploy:production:
  stage: deploy-prod
  image: alpine:latest
  extends:
    - .rules:manual_production
  needs:
    - job: deploy:staging
  before_script:
    - apk add --no-cache curl
  script:
    - echo "Deploying to PRODUCTION environment..."
    - echo "Tag: ${CI_COMMIT_TAG:-${CI_COMMIT_SHORT_SHA}}"
    # Добавьте команды для деплоя в production
  environment:
    name: production
    url: https://example.com
  when: manual
  only:
    - tags
    - master
    - main
  tags:
    - docker
