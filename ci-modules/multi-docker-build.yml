.build-service:
  stage: build
  image: docker:24.0.7
  services:
    - name: docker:24.0.7-dind
      command: ["--experimental"]
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
    DOCKER_BUILDKIT: 1
    SERVICE_NAME: ""
    DOCKERFILE_PATH: ""
  before_script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  script:
    - |
      echo "Building service: $SERVICE_NAME from Dockerfile: $DOCKERFILE_PATH"
      docker build \
        --build-arg BUILDKIT_INLINE_CACHE=1 \
        --cache-from $CI_REGISTRY_IMAGE/$SERVICE_NAME:latest \
        -t $CI_REGISTRY_IMAGE/$SERVICE_NAME:$CI_COMMIT_SHORT_SHA \
        -t $CI_REGISTRY_IMAGE/$SERVICE_NAME:latest \
        -f $DOCKERFILE_PATH .
      docker push $CI_REGISTRY_IMAGE/$SERVICE_NAME:$CI_COMMIT_SHORT_SHA
      docker push $CI_REGISTRY_IMAGE/$SERVICE_NAME:latest
  after_script:
    - docker image prune -f
  retry:
    max: 2
    when:
      - runner_system_failure
      - stuck_or_timeout_failure