services:
  db:
    image: mysql:8.0
    container_name: react_spring_db
    env_file: .env
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "$MYSQL_USER", "-p$MYSQL_PASSWORD"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - app_network
    user: "999:999"

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: react_spring_backend
    env_file: backend.env
    networks:
      - app_network
    depends_on:
      - db
    user: "1000:1000"

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: react_spring_frontend
    networks:
      - app_network
    depends_on:
      - backend

  nginx-proxy:
    build:
      context: .
      dockerfile: Dockerfile.proxy
    container_name: react_spring_nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - app_network
    depends_on:
      - frontend
      - backend

networks:
  app_network:
    driver: bridge

volumes:
  db_data:
    driver: local
