# Универсальный модуль для сборки Docker образов
# Параметризируется переменными GitLab CI/CD

.docker_build_template:
  image: docker:24-dind
  services:
    - docker:24-dind
  variables:
    DOCKER_DRIVER: overlay2
    DOCKER_TLS_CERTDIR: "/certs"
    DOCKER_BUILDKIT: "1"
    BUILDKIT_PROGRESS: plain
    # Переопределяемые переменные
    DOCKERFILE_PATH: "Dockerfile"
    BUILD_CONTEXT: "."
    IMAGE_NAME: ""
    BUILD_TARGET: ""
    BUILD_ARGS: ""
  before_script:
    - docker info
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin $CI_REGISTRY
  script:
    # Формируем теги
    - export IMAGE_TAG="${CI_COMMIT_REF_SLUG}-${CI_COMMIT_SHORT_SHA}"
    - export IMAGE_LATEST="${CI_REGISTRY_IMAGE}/${IMAGE_NAME}:latest"
    - export IMAGE_TAGGED="${CI_REGISTRY_IMAGE}/${IMAGE_NAME}:${IMAGE_TAG}"
    - export IMAGE_BRANCH="${CI_REGISTRY_IMAGE}/${IMAGE_NAME}:${CI_COMMIT_REF_SLUG}"

    # Формируем аргументы сборки
    - |
      BUILD_CMD="docker build"
      BUILD_CMD="$BUILD_CMD --file ${DOCKERFILE_PATH}"
      BUILD_CMD="$BUILD_CMD --cache-from ${IMAGE_LATEST}"
      BUILD_CMD="$BUILD_CMD --build-arg BUILDKIT_INLINE_CACHE=1"

      if [ -n "$BUILD_TARGET" ]; then
        BUILD_CMD="$BUILD_CMD --target ${BUILD_TARGET}"
      fi

      if [ -n "$BUILD_ARGS" ]; then
        for arg in $BUILD_ARGS; do
          BUILD_CMD="$BUILD_CMD --build-arg $arg"
        done
      fi

      BUILD_CMD="$BUILD_CMD --tag ${IMAGE_TAGGED}"
      BUILD_CMD="$BUILD_CMD --tag ${IMAGE_BRANCH}"

      if [ "$CI_COMMIT_BRANCH" = "$CI_DEFAULT_BRANCH" ]; then
        BUILD_CMD="$BUILD_CMD --tag ${IMAGE_LATEST}"
      fi

      BUILD_CMD="$BUILD_CMD ${BUILD_CONTEXT}"

    # Выполняем сборку
    - echo "Executing: $BUILD_CMD"
    - eval $BUILD_CMD

    # Публикуем образы
    - docker push ${IMAGE_TAGGED}
    - docker push ${IMAGE_BRANCH}
    - |
      if [ "$CI_COMMIT_BRANCH" = "$CI_DEFAULT_BRANCH" ]; then
        docker push ${IMAGE_LATEST}
      fi
  after_script:
    - docker logout $CI_REGISTRY
  tags:
    - docker
  retry:
    max: 2
    when:
      - runner_system_failure
      - stuck_or_timeout_failure
