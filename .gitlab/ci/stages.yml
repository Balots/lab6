# Определение стадий пайплайна

stages:
  - validate       # Валидация и линтинг
  - build          # Сборка образов
  - test           # Тестирование
  - scan           # Сканирование безопасности
  - deploy-dev     # Развертывание в dev окружение
  - deploy-staging # Развертывание в staging
  - deploy-prod    # Развертывание в production
